name: "Package"
on: push
permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  security-events: write # Required for uploading code scanning.
  attestations: write
  artifact-metadata: write
  issues: write
env:
  JF_REGISTRY: "${{vars.JF_NAME}}.jfrog.io"
  JF_RT_URL: "https://${{vars.JF_NAME}}.jfrog.io"
  PROJECT_KEY: "npmapptrust"
  APPLICATION_KEY: "swaggerapp" 
  RT_REPO_NPM_VIRTUAL: "npmapptrust-virtual" 
  RT_REPO_DOCKER_VIRTUAL: "npmapptrust-docker-virtual" 
  BUILD_ID: "${{github.run_number}}"
  JOB_SUMMARY: false
  CLI_LOG_LEVEL: DEBUG # DEBUG, INFO, WARN, ERROR
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_VERSION: '25'
  #RBV2_SIGNING_KEY: "${{secrets.RBV2_SIGNING_KEY}}" # ref https://jfrog.com/help/r/jfrog-artifactory-documentation/create-signing-keys-for-release-bundles-v2
  DEFAULT_WORKSPACE: "${{github.workspace}}"  # /home/runner/work/spring-petclinic/spring-petclinic

jobs:
  dockerPackage:
    name: "Docker Package"
    env:  
      BUILD_NAME: "ga-dkr"
      DOCKER_BUILDX_PLATFORMS: 'linux/amd64,linux/arm64'
      DOCKER_METADATA_JSON: 'build-metadata.json'
    defaults:
       run:
         working-directory: "${{env.DEFAULT_WORKSPACE}}"
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ref  https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idtimeout-minutes
    steps:
      # - uses: muldos/ci-traffic-monitor@v1
      #   with:
      #     detailed: 'true'
      # Use the specific setup-cli branch. Ref https://github.com/marketplace/actions/setup-jfrog-cli
      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@v5
        id: setup-cli
        env:
          JF_URL: ${{env.JF_RT_URL}}
          JF_PROJECT: "${{env.PROJECT_KEY}}"
          JFROG_CLI_LOG_LEVEL: "${{env.CLI_LOG_LEVEL}}"
          JFROG_CLI_RELEASES_REPO: '${{env.JF_RT_URL}}/artifactory/${{env.RT_REPO_NPM_VIRTUAL}}' 
          JFROG_CLI_EXTRACTORS_REMOTE: '${{env.JF_RT_URL}}/artifactory/${{env.RT_REPO_NPM_VIRTUAL}}'
          JF_GIT_TOKEN: ${{secrets.GITHUB_TOKEN}}      
        with:
          version: latest  #2.71.0
          oidc-provider-name: ${{vars.JF_OIDC_PROVIDER_NAME}}
          disable-job-summary: ${{env.JOB_SUMMARY}}

      - name: "Clone VCS"
        uses: actions/checkout@v6 # ref: https://github.com/actions/checkout

      - name: "Clean lock files"
        run: |
          rm -rf package-lock.json

      - name: "Config jf with repos"
        run: |
          jf npmc --global --repo-resolve ${{ env.RT_REPO_NPM_VIRTUAL}} --repo-deploy ${{ env.RT_REPO_NPM_VIRTUAL}} 
          jf npm cache clean --force

      - name: "Create ENV variables"
        run: |
          echo "SHORT_COMMIT_CODE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TODAYS_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: "Docker authentication"  # ref https://github.com/marketplace/actions/docker-login
        id: config-docker
        uses: docker/login-action@v4
        with: 
          registry: ${{env.JF_REGISTRY}}
          username: ${{steps.setup-cli.outputs.oidc-user}}
          password: ${{steps.setup-cli.outputs.oidc-token}}

      - name: "Docker: QEMU (cross-arch)"
        uses: docker/setup-qemu-action@v4

      - name: "Docker buildx instance"
        uses: docker/setup-buildx-action@v4   # ref: https://github.com/marketplace/actions/docker-setup-buildx h
        with:
          use: true
          driver: docker-container
          platforms: ${{env.DOCKER_BUILDX_PLATFORMS}} # linux/amd64,linux/arm64 # ref: https://docs.docker.com/reference/cli/docker/buildx/create/#platform

      
      ## Package
       ### TODO: CA command - docker image
         
       ### TODO: Audit command

      - name: "Package: Docker build and push"
        env:
          DOCKER_FILE: "./jfrog/Dockerfile"
          TAG11: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:${{env.SHORT_COMMIT_CODE}}"
          TAG12: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:${{env.TODAYS_DATE}}" 
          TAG13: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:${{env.BUILD_ID}}"
          TAG14: "${{vars.JF_NAME}}.jfrog.io/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:latest"
        run: | # --build-arg JAR_FILE=${{env.JAR_FILE}} 
          docker buildx build -f ${{env.DOCKER_FILE}} --platform "${{env.DOCKER_BUILDX_PLATFORMS}}" --metadata-file "${{env.DOCKER_METADATA_JSON}}" --push -t ${{env.TAG11}} -t ${{env.TAG12}} -t ${{env.TAG13}} -t ${{env.TAG14}} .

      - name: "Optional: Docker pull image"
        run: |
          docker pull ${{env.RT_REPO_DOCKER_URL}}

      - name: "Package: Docker image list"
        run: |
          docker image ls

      # Build Info
      - name: "BuildInfo: Docker build create"
        run: |
          imageDigest=$(jq -r '.["containerimage.digest"]' "${{env.DOCKER_METADATA_JSON}}")
          echo "DOCKER_IMAGE_DIGEST: ${imageDigest}"
          echo "DOCKER_IMAGE_DIGEST=${imageDigest}" >> "$GITHUB_ENV"

          echo "${{env.RT_REPO_DOCKER_URL}}@${imageDigest}" > "${{env.DOCKER_METADATA_JSON}}"

          jf rt bdc ${{env.RT_REPO_VIRTUAL}} --image-file ${{env.DOCKER_METADATA_JSON}} --build-name=${{env.BUILD_NAME}} --build-number=${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"

      - name: "BuildInfo: Build Publish"
        run: |
          jf rt bce ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}"
          jf rt bag ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" 
          jf rt bp ${{env.BUILD_NAME}} ${{env.BUILD_ID}} --project="${{env.PROJECT_KEY}}" --detailed-summary=true 

      # App Version
      - name: "AppTrust: create application version"
        env:
          APP_SPEC_JSON: ./appver-spec-${{env.APPLICATION_KEY}}-${{env.BUILD_ID}}.json
        run: |
          cat > "${{env.APP_SPEC_JSON}}" <<EOF
          {
            "builds": [
              {
                "name": "${{env.BUILD_NAME}}",
                "number": "${{env.BUILD_ID}}",
                "repository_key": "${{env.PROJECT_KEY}}-build-info",
                "include_dependencies": false
              }
            ]
          }
          EOF

          cat "${{env.APP_SPEC_JSON}}"    # https://docs.jfrog.com/governance/docs/create-application-version-cli

          jf apptrust version-create "${{env.APPLICATION_KEY}}" "${{env.BUILD_ID}}" --spec="${{env.APP_SPEC_JSON}}"       #  --tag="Package"

