name: "AppTrust: Package"
on: push

permissions:
  actions: read
  id-token: write # OIDC token for JFrog CLI and Docker login
  contents: read
  packages: write
  security-events: write
  attestations: write
  artifact-metadata: write
  issues: write

env:
  JF_REGISTRY: "${{ vars.JF_NAME }}.jfrog.io"
  JF_RT_URL: "https://${{ vars.JF_NAME }}.jfrog.io"
  JF_OIDC_PROVIDER_NAME: "${{ vars.JF_OIDC_PROVIDER_NAME }}"
  PROJECT_KEY: "npmapptrust"
  APPLICATION_KEY: "swaggerapp"
  RT_REPO_NPM_VIRTUAL: "npmapptrust-virtual"
  RT_REPO_DOCKER_VIRTUAL: "npmapptrust-docker-virtual"
  # AppTrust version-create requires SemVer. Run number alone is not SemVer.
  JFROG_CLI_LOG_LEVEL: DEBUG
  BUILD_ID: "${{ github.run_number }}"
  APPLICATION_VERSION: "${{ github.run_number }}.${{ github.run_attempt }}"
  DEFAULT_WORKSPACE: "${{github.workspace}}"
  APP_SPEC_JSON: "appver-spec.json"
  JF_CLI_SERVER_ID: "setup-jfrog-cli"
jobs:
  dockerPackage:
    name: "Docker Package"
    env:
      BUILD_NAME: "ga-dkr"
      DOCKER_BUILDX_PLATFORMS: "linux/amd64,linux/arm64"
      DOCKER_FILE: "./jfrog/Dockerfile"
      DOCKER_METADATA_JSON: "build-metadata.json"
      DOCKER_IMAGE_FILE: "docker-image.txt"
    defaults:
       run:
         working-directory: "${{env.DEFAULT_WORKSPACE}}"
    runs-on: ubuntu-latest
    steps:
      - name: "Clone VCS"
        uses: actions/checkout@v7

      - name: "Use Node.js"
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: "Setup JFrog CLI"
        id: "setup-jfrog-cli"
        uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: ${{ env.JF_RT_URL }}
          JF_PROJECT: ${{ env.PROJECT_KEY }}
        with:
          version: latest
          oidc-provider-name: ${{ env.JF_OIDC_PROVIDER_NAME }}
          disable-auto-build-publish: "true"

      - name: "Create ENV variables"
        run: |
          set -euo pipefail
          echo "SHORT_COMMIT_CODE=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "TODAYS_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          rm -f package-lock.json .npmrc

      - name: "Config jf with repos"
        run: |
          jf npmc --repo-resolve "${{ env.RT_REPO_NPM_VIRTUAL }}" --repo-deploy "${{ env.RT_REPO_NPM_VIRTUAL }}"

      - name: "Install dependencies and build app"
        run: |
          set -euo pipefail
          jf npm install
          jf npm run build:app
          test -d build

      - name: "Docker authentication"
        uses: docker/login-action@v4
        with:
          registry: ${{ env.JF_REGISTRY }}
          username: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}

      - name: "Docker: QEMU (cross-arch)"
        uses: docker/setup-qemu-action@v4

      - name: "Docker buildx instance"
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          platforms: ${{ env.DOCKER_BUILDX_PLATFORMS }}
          use: true

      - name: "Set Docker tags"
        run: |
          set -euo pipefail
          echo "tag_build=${{env.JF_REGISTRY}}/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:${{env.BUILD_ID}}" >> "$GITHUB_ENV"
          echo "tag_date=${{env.JF_REGISTRY}}/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:${{env.TODAYS_DATE}}" >> "$GITHUB_ENV"
          echo "tag_sha=${{env.JF_REGISTRY}}/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:${{env.SHORT_COMMIT_CODE}}" >> "$GITHUB_ENV"
          echo "tag_latest="${{env.JF_REGISTRY}}/${{env.RT_REPO_DOCKER_VIRTUAL}}/${{env.BUILD_NAME}}:latest" >> "$GITHUB_ENV"

      - name: "Package: Docker build and push"
        run: |
          set -euo pipefail
          docker buildx build -f "${{env.DOCKER_FILE}}" --platform "${{env.DOCKER_BUILDX_PLATFORMS}}" --metadata-file "${{env.DOCKER_METADATA_JSON}}" --push -t "${{env.tag_sha}}" -t "${{env.tag_date}}" -t "${{env.tag_build}}" -t "${{env.tag_latest}}" .

          image_digest="$(jq -er '.["containerimage.digest"]' "${DOCKER_METADATA_JSON}")"
          case "${image_digest}" in
            sha256:*) ;;
            *)
              echo "Docker metadata is missing a sha256 digest: ${image_digest}" >&2
              exit 1
              ;;
          esac
          # jf rt bdc accepts one line: <image-tag>@sha256:<manifest-digest>
          printf '%s@%s\n' "${tag_build}" "${image_digest}" | tee "${DOCKER_IMAGE_FILE}"

      - name: "BuildInfo"
        run: |
          set -euo pipefail
          test -s "${DOCKER_IMAGE_FILE}"
          grep -Eq '^[^[:space:]]+@sha256:[0-9a-f]{64}$' "${DOCKER_IMAGE_FILE}"

          jf rt bdc "${{env.RT_REPO_DOCKER_VIRTUAL}}" \
            --image-file="${DOCKER_IMAGE_FILE}" \
            --build-name="${{env.BUILD_NAME}}" \
            --build-number="${{env.BUILD_ID}}" \
            --project="${{env.PROJECT_KEY}}"

          jf rt bp "${{env.BUILD_NAME}}" "${{env.BUILD_ID}}" \
            --collect-git-info=true \
            --collect-env=true \
            --project="${{env.PROJECT_KEY}}" \
            --detailed-summary=true

      - name: "AppTrust: create application version"
        run: |
          set -euo pipefail
          jq -n \
            --arg name "${{env.BUILD_NAME}}" \
            --arg number "${{env.BUILD_ID}}" \
            --arg repo "${{env.PROJECT_KEY}}-build-info" \
            '{builds: [{name: $name, number: $number, repository_key: $repo, include_dependencies: false}]}' \
            > "${{env.APP_SPEC_JSON}}"
          cat "${APP_SPEC_JSON}"
          jf apptrust version-create "${{env.APPLICATION_KEY}}" "${{env.APPLICATION_VERSION}}" --spec="${{env.APP_SPEC_JSON}}"
