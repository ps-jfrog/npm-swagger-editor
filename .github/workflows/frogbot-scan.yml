name: "Frogbot Scan"

# Frogbot v3 demo workflow (see docs/usefrogbotv3.md)
#   - scan-pull-request : runs on PRs, diff-scans what the PR introduces, comments on the PR
#   - scan-repository   : runs on push to main / nightly / manually, opens fix PRs for vulnerable deps
# Everything else (scanners on/off, auto-fix PRs, secrets in PR comments, fail rules) is configured
# server-side in the JFrog Platform (Config Profile + Xray Watch/Policy). There is no JF_FAIL in v3.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, 'demo/**']
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      workspace:
        description: "Frogbot workspace (Xray Git Repositories > Manage Workspaces). Empty = 'default'"
        required: false
        default: ""

permissions:
  contents: write         # scan-repository: push fix branches
  pull-requests: write    # PR comments + fix PRs
  security-events: write  # upload SARIF / code scanning results
  id-token: write         # only needed when using OIDC (oidc-provider-name)

env:
  # Full platform URL, from repo variable FROGBOT_JF_URL (deliberately NOT 'JF_URL': an org-level JF_URL
  # pointing at another instance would silently win). Falls back to the psazuse demo instance.
  JF_URL: ${{ vars.FROGBOT_JF_URL || 'https://psazuse.jfrog.io' }}
  # Optional: JFrog Project key. With a project key, the Project's Watches apply even if no
  # Watch is attached directly to the git repo.
  JF_PROJECT_KEY: ${{ vars.JF_PROJECT_KEY || 'npmapptrust' }}
  # Workspace = named scan unit of this repo with its own Config Profile (manual runs can pass an input).
  JF_GIT_WORKSPACE: ${{ inputs.workspace || vars.JF_GIT_WORKSPACE }}
  # Air-gapped / proxied scanner + Frogbot download: Artifactory *repo name* (no server-id prefix).
  JF_RELEASES_REPO: ${{ vars.JF_RELEASES_REPO }}
  # SAST scan mode for large repos: codebase (default) | directory | file
  JF_SAST_DEFAULT_SCAN_MODE: ${{ vars.JF_SAST_DEFAULT_SCAN_MODE }}
  # Use "DEBUG" to see Watch matching and 'fail_pull_request' decisions; "INFO" once the demo works.
  JFROG_CLI_LOG_LEVEL: ${{ vars.JFROG_CLI_LOG_LEVEL || 'DEBUG' }}

jobs:
  scan-pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    environment: frogbot   # add "required reviewers" on this environment to gate fork PRs (secrets!)
    steps:
      # No checkout needed: Frogbot clones the repo and diffs source vs target branch itself.
      - uses: jfrog/frogbot@v3
        env:
          # Auth option A: access token stored as an *environment secret* named FROGBOT_ACCESS_TOKEN
          JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR findings -> GitHub Code Scanning (Security tab). Needs GitHub Advanced Security / public repo.
          JF_UPLOAD_PR_SECURITY_RESULTS_TO_VCS: ${{ vars.JF_UPLOAD_PR_SECURITY_RESULTS_TO_VCS || 'true' }}
        with:
          version: latest
          # Auth option B: OIDC. Set repo variable JF_OIDC_PROVIDER_NAME and leave the secret empty.
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}

  scan-repository:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    environment: frogbot
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # github.head_ref is empty outside pull_request events

      # Frogbot builds the dependency graph from installed deps / lockfiles. Lockfiles are gitignored in
      # this repo, so install first (otherwise the scan can report an empty SBOM and zero findings).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (root app + findings demo)
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          (cd demo/frogbot-findings 2>/dev/null && npm install --ignore-scripts --no-audit --no-fund || true)

      - uses: jfrog/frogbot@v3
        env:
          JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ github.ref_name }}
          # SBOM -> GitHub Dependency Graph (default true; needs contents: write)
          JF_UPLOAD_SBOM_TO_VCS: ${{ vars.JF_UPLOAD_SBOM_TO_VCS || 'true' }}
        with:
          version: latest
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}
